    <!-- Google tag (gtag.js) - Google Tag & GA4 - Deferred for performance -->
    <script>
      // Initialize dataLayer early but defer gtag loading
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      
      // Load GTM script when browser is idle
      function loadGTM() {
        var script = document.createElement('script');
        script.src = 'https://www.googletagmanager.com/gtag/js?id=GT-TXZP837S';
        script.async = true;
        script.onload = function() {
          gtag('js', new Date());
          gtag('config', 'GT-TXZP837S');
          gtag('config', 'G-W03ZKHKH45');
        };
        document.head.appendChild(script);
      }
      
      if (document.readyState === 'complete') {
        if ('requestIdleCallback' in window) {
          requestIdleCallback(loadGTM, { timeout: 3000 });
        } else {
          setTimeout(loadGTM, 2000);
        }
      } else {
        window.addEventListener('load', function() {
          if ('requestIdleCallback' in window) {
            requestIdleCallback(loadGTM, { timeout: 3000 });
          } else {
            setTimeout(loadGTM, 2000);
          }
        });
      }
    </script>

    <!-- 
      SECURITY NOTE: Subresource Integrity (SRI) 
      
      SRI is intentionally NOT applied to Google Tag Manager and Google AdSense scripts because:
      1. These scripts are dynamically updated by Google without version control
      2. Adding integrity hashes would break functionality when Google updates their CDN
      3. CSP (Content Security Policy) provides adequate protection by:
         - Whitelisting only trusted Google domains (googletagmanager.com, googlesyndication.com)
         - Blocking any unauthorized scripts from other domains
         - Preventing inline script injection except from whitelisted sources
      
      This approach follows industry best practices for third-party advertising and analytics.
      Reference: https://developer.mozilla.org/en-US/docs/Web/Security/Subresource_Integrity
    -->

    <script>

        var script = document.createElement('script');
        script.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7563901271542265';
        script.crossOrigin = 'anonymous';
        script.async = true;
        document.head.appendChild(script);

      window.addEventListener('load', function() {
        // Use requestIdleCallback for optimal loading, with 4s fallback
        if ('requestIdleCallback' in window) {

        } else {
          setTimeout(loadAdSense, 4000);
        }
      });
    </script>

    <!-- Global Design Theme v1 -->

      /* 2. Root Variables (Our Color & Font Palette) */
      :root {
        --theme-primary: #A78BFA;      /* A modern, soft purple */
        --theme-primary-dark: #5B21B6; /* A darker purple for active states */
        --theme-bg: #F5F3FF;           /* A very light lavender background */
        --theme-bg-card: #FFFFFF;      /* White for all cards */
        --theme-text-dark: #1F2937;    /* Dark grey for text */
        --theme-text-light: #6B7280;   /* Lighter grey for subtext */
        --theme-border: #E5E7EB;       /* Light border for inputs */
        --font-primary: 'Plus Jakarta Sans', sans-serif; /* Modern, clean font */
      }

      /* 3. Global Body Styling */
      body {
        font-family: var(--font-primary);
        background-color: var(--theme-bg);
        color: var(--theme-text-dark);
      }

      /* 4. Heading & Text Styling */
      h1, h2, h3, h4, h5, h6 {
        font-weight: 800;
        color: var(--theme-text-dark);
      }
      p {
        color: var(--theme-text-light);
        line-height: 1.6;
      }

      /* 5. Main Action Button Styling */
      .main-action-button, button {
        background-color: var(--theme-primary);
        color: var(--theme-bg-card);
        border: none;
        border-radius: 12px;
        padding: 12px 24px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(167, 139, 250, 0.2);
      }

      .main-action-button:hover, button:hover {
        transform: scale(1.05);
        filter: brightness(1.1);
        box-shadow: 0 6px 20px rgba(167, 139, 250, 0.4);
      }

      /* 6. Main Tab Navigation Styling */
      .tab-navigation-container {
        display: flex;
        flex-wrap: wrap; /* Fix for mobile stacking bug */
        gap: 10px;
        border-bottom: 2px solid var(--theme-border);
      }

      .tab-item {
        background: transparent;
        color: var(--theme-text-light);
        padding: 10px 15px;
        border: none;
        border-bottom: 3px solid transparent;
        font-weight: 600;
        transition: all 0.3s ease;
      }

      .tab-item.active {
        color: var(--theme-primary-dark);
        border-bottom-color: var(--theme-primary-dark);
      }

      .tab-item:not(.active):hover {
        color: var(--theme-text-dark);
        background-color: var(--theme-bg);
      }

      /* 7. Card & Container Styling */
      .content-card {
        background-color: var(--theme-bg-card);
        border-radius: 24px;
        padding: 24px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
      }

      /* 8. Input Field Styling */
      input[type="text"], input[type="url"], input[type="email"], input[type="password"], textarea, select {
        background-color: var(--theme-bg-card);
        border: 1px solid var(--theme-border);
        border-radius: 12px;
        padding: 12px 15px;
        font-family: var(--font-primary);
        color: var(--theme-text-dark);
        width: 100%;
        transition: border-color 0.3s ease, box-shadow 0.3s ease;
      }

      input[type="text"]:focus, textarea:focus, select:focus {
        outline: none;
        border-color: var(--theme-primary);
        box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.3);
      }
    </style>
