    <!-- Global Design Theme v2 - Based on Reference Image -->
    <style>
      /* 1. Root Variables - Color Palette Extracted from Reference */
      :root {
        --theme-bg-gradient-start: #E9D5FF;  /* Light lavender top */
        --theme-bg-gradient-end: #DDD6FE;    /* Slightly darker lavender bottom */
        --theme-primary-purple: #A78BFA;     /* Main purple for buttons/cards */
        --theme-purple-medium: #C4B5FD;      /* Medium purple for gradients */
        --theme-purple-dark: #9333EA;        /* Dark purple for active states */
        --theme-purple-deeper: #7C3AED;      /* Deeper purple for nested elements */
        --theme-text-navy: #1E293B;          /* Dark navy for headings */
        --theme-text-slate: #334155;         /* Slate for body text */
        --theme-text-light: #64748B;         /* Light slate for secondary text */
        --theme-white: #FFFFFF;              /* Pure white */
        --theme-cream: #FEFEFE;              /* Off-white/cream */
        --theme-card-bg: #FFFFFF;            /* White card background */
        --theme-border-light: #E2E8F0;       /* Light border */
        --font-primary: 'Inter', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      /* 2. Import Google Fonts */
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

      /* 3. Global Body Styling with Gradient Background */
      body {
        font-family: var(--font-primary);
        background: linear-gradient(180deg, var(--theme-bg-gradient-start) 0%, var(--theme-bg-gradient-end) 100%);
        color: var(--theme-text-slate);
        min-height: 100vh;
      }

      /* 4. Heading & Text Styling */
      h1, h2, h3, h4, h5, h6 {
        font-weight: 800;
        color: var(--theme-text-navy);
        letter-spacing: -0.02em;
      }
      
      h1 {
        font-size: 3.5rem;
        line-height: 1.1;
      }
      
      h2 {
        font-size: 2.25rem;
        line-height: 1.2;
      }
      
      p {
        color: var(--theme-text-light);
        line-height: 1.6;
        font-weight: 400;
      }

      /* 5. Main Action Button Styling - Large Purple Buttons */
      .main-action-button, 
      button.btn-primary {
        background: linear-gradient(135deg, var(--theme-primary-purple) 0%, var(--theme-purple-medium) 100%);
        color: var(--theme-text-navy);
        border: none;
        border-radius: 9999px;
        padding: 18px 48px;
        font-weight: 700;
        font-size: 1.125rem;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 8px 24px rgba(167, 139, 250, 0.3);
        letter-spacing: -0.01em;
      }

      .main-action-button:hover, 
      button.btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 32px rgba(167, 139, 250, 0.4);
        filter: brightness(1.05);
      }

      .main-action-button:active, 
      button.btn-primary:active {
        transform: translateY(0);
      }

      /* 6. Secondary Button Styling - Nested Dark Purple Buttons */
      .btn-secondary,
      button.btn-nested {
        background: linear-gradient(135deg, var(--theme-purple-dark) 0%, var(--theme-purple-deeper) 100%);
        color: var(--theme-white);
        border: none;
        border-radius: 16px;
        padding: 12px 24px;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 12px rgba(147, 51, 234, 0.3);
      }

      .btn-secondary:hover,
      button.btn-nested:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 16px rgba(147, 51, 234, 0.4);
        filter: brightness(1.1);
      }

      /* 7. Card & Container Styling - Outer White Cards */
      .content-card,
      .card-outer {
        background-color: var(--theme-card-bg);
        border-radius: 32px;
        padding: 32px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08), 0 4px 12px rgba(0, 0, 0, 0.05);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.8);
      }

      /* 8. Inner Purple Cards - For Nested Content */
      .card-inner-purple,
      .content-card-purple {
        background: linear-gradient(135deg, var(--theme-primary-purple) 0%, var(--theme-purple-medium) 100%);
        border-radius: 24px;
        padding: 24px;
        box-shadow: 0 8px 24px rgba(167, 139, 250, 0.25);
        color: var(--theme-white);
      }

      .card-inner-purple h2,
      .card-inner-purple h3,
      .card-inner-purple p,
      .content-card-purple h2,
      .content-card-purple h3,
      .content-card-purple p {
        color: var(--theme-white);
      }

      /* 9. Input Field Styling */
      input[type="text"], 
      input[type="url"], 
      input[type="email"], 
      input[type="password"], 
      input[type="date"],
      textarea, 
      select {
        background-color: var(--theme-white);
        border: 2px solid var(--theme-border-light);
        border-radius: 16px;
        padding: 14px 18px;
        font-family: var(--font-primary);
        color: var(--theme-text-slate);
        width: 100%;
        font-size: 1rem;
        transition: all 0.3s ease;
      }

      input:focus, 
      textarea:focus, 
      select:focus {
        outline: none;
        border-color: var(--theme-primary-purple);
        box-shadow: 0 0 0 4px rgba(167, 139, 250, 0.15);
      }

      /* 10. Tab Navigation Styling */
      .tab-navigation-container {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        border-bottom: 2px solid var(--theme-border-light);
        margin-bottom: 24px;
      }

      .tab-item {
        background: transparent;
        color: var(--theme-text-light);
        padding: 12px 20px;
        border: none;
        border-bottom: 3px solid transparent;
        font-weight: 600;
        font-size: 0.95rem;
        transition: all 0.3s ease;
        cursor: pointer;
      }

      .tab-item.active {
        color: var(--theme-purple-dark);
        border-bottom-color: var(--theme-purple-dark);
      }

      .tab-item:not(.active):hover {
        color: var(--theme-text-slate);
        background-color: rgba(167, 139, 250, 0.1);
      }

      /* 11. Loading Indicator */
      .loading-spinner {
        border: 3px solid rgba(167, 139, 250, 0.2);
        border-top-color: var(--theme-primary-purple);
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      /* 12. Label Styling */
      label {
        color: var(--theme-text-navy);
        font-weight: 600;
        font-size: 0.9rem;
        margin-bottom: 8px;
        display: block;
      }

      /* 13. Dropdown Styling */
      select {
        appearance: none;
        background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L6 6L11 1' stroke='%231E293B' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E");
        background-repeat: no-repeat;
        background-position: right 16px center;
        padding-right: 48px;
      }

      /* 14. Scrollbar Styling */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }

      ::-webkit-scrollbar-track {
        background: var(--theme-bg-gradient-end);
      }

      ::-webkit-scrollbar-thumb {
        background: var(--theme-primary-purple);
        border-radius: 4px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: var(--theme-purple-dark);
      }
    </style>
  </head>
